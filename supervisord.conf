[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/lib/unique/supervisord.pid

[unix_http_server]
file=/var/lib/unique/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/lib/unique/supervisor.sock

[program:api]
command=/bin/sh -c "python scripts/wait_for_db.py && exec gunicorn --bind ${APP_HOST:-0.0.0.0}:${APP_PORT:-8000} --workers ${WEB_CONCURRENCY:-1} --access-logfile - --error-logfile - wsgi:app"
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "python scripts/wait_for_db.py && exec python -m app.jobs"
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
